[package]
name = "zcash_primitives"
description = "Rust implementations of the Zcash primitives"
version = "0.31.0"
authors = [
    "Jack Grigg <jack@z.cash>",
    "Kris Nuttycombe <kris@electriccoin.co>"
]
homepage = "https://github.com/zcash/librustzcash"
repository.workspace = true
readme = "README.md"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
equihash.workspace = true
zcash_encoding.workspace = true
zcash_protocol.workspace = true
zcash_script.workspace = true

# Dependencies exposed in a public API:
# (Breaking upgrades to these require a breaking upgrade to this crate.)
# - CSPRNG
rand_core.workspace = true

# - Digests (output types exposed)
blake2b_simd.workspace = true
sha2.workspace = true

# - Logging and metrics
memuse.workspace = true

# - Shielded protocols
ff = { workspace = true, optional = true }
jubjub = { workspace = true, optional = true }
nonempty = { workspace = true, optional = true }
orchard = { workspace = true, optional = true }
sapling = { workspace = true, optional = true }

# - Note Commitment Trees
incrementalmerkletree = { workspace = true, features = ["legacy-api"] }

# - Test dependencies
proptest = { workspace = true, optional = true }

# - Transparent protocol
transparent.workspace = true

# - Transparent inputs
#   - `SecretKey` and `PublicKey` types exposed
secp256k1 = { workspace = true, optional = true }

# Dependencies used internally:
# (Breaking upgrades to these are usually backwards-compatible, but check MSRVs.)
# - Documentation
document-features = { workspace = true, optional = true }

# - Encodings
hex.workspace = true

# - Shielded protocols
redjubjub = { workspace = true, optional = true }

# No-std support
corez.workspace = true

[dependencies.zcash_note_encryption]
workspace = true
features = ["pre-zip-212"]
optional = true

[dev-dependencies]
bls12_381.workspace = true
criterion.workspace = true
incrementalmerkletree = { workspace = true, features = ["legacy-api", "test-dependencies"] }
proptest.workspace = true
assert_matches.workspace = true
rand = { workspace = true, features = ["sys_rng"] }
rand_xorshift.workspace = true
transparent = { workspace = true, features = ["test-dependencies"] }
sapling = { workspace = true, features = ["test-dependencies"] }
orchard = { workspace = true, features = ["test-dependencies"] }
zcash_protocol = { workspace = true, features = ["local-consensus", "test-dependencies"] }
zip32.workspace = true

[target.'cfg(unix)'.dev-dependencies]
pprof = { version = "0.15", features = ["criterion", "flamegraph"] }

[features]
default = ["multicore", "std", "circuits"]
std = [
    "document-features",
    "redjubjub?/std",
    "sapling?/std",
    "orchard?/std",
    "transparent/std",
]

## Enables the experimental ZIP 233 transaction amount when combined with
## `--cfg zcash_unstable="zip233"`.
zip-233 = []

## Enables the Sapling shielded protocol domain types and conversions.
##
## Without this feature, Sapling bundles are still parsed, retained, and
## re-serialized by the byte layer, but no typed Sapling values are constructed.
sapling = [
    "dep:sapling",
    "dep:redjubjub",
    "dep:jubjub",
    "dep:ff",
    "dep:zcash_note_encryption",
]

## Enables the Orchard and Ironwood shielded protocol domain types and
## conversions.
##
## Without this feature, Orchard and Ironwood bundles are still parsed,
## retained, and re-serialized by the byte layer, but no typed Orchard values
## are constructed.
orchard = [
    "dep:orchard",
    "dep:nonempty",
    "dep:zcash_note_encryption",
]

## Enables creating proofs. This requires both shielded protocol domains.
circuits = ["sapling", "orchard", "orchard/circuit", "sapling/circuit"]

## Enables multithreading support for creating proofs.
multicore = ["orchard?/multicore", "sapling?/multicore"]

## Enables spending transparent notes with the transaction builder.
transparent-inputs = [
    "transparent/transparent-inputs",
    "dep:secp256k1",
]

### A temporary feature flag that exposes granular APIs needed by `zcashd`. These APIs
### should not be relied upon and will be removed in a future release.
temporary-zcashd = []

## Exposes APIs that are useful for testing, such as `proptest` strategies.
test-dependencies = [
    "dep:proptest",
    "incrementalmerkletree/test-dependencies",
    "orchard?/test-dependencies",
    "sapling?/test-dependencies",
    "transparent/test-dependencies",
    "zcash_protocol/test-dependencies",
]

## A feature used to isolate tests that are expensive to run. Test-only.
expensive-tests = []

## A feature used to ensure that expensive tests do not run when running with --all-features
no-expensive-tests = []

## A feature that provides `FeeRule` implementations and constructors for
## non-standard fees.
non-standard-fees = []

[lib]
bench = false

[[bench]]
name = "note_decryption"
harness = false
# Needs `sapling::prover::mock`, which sapling gates behind its `circuit` feature.
required-features = ["circuits"]

[badges]
maintenance = { status = "actively-developed" }

[lints]
workspace = true

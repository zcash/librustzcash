name: librustzcash documentation

on:
  push:
    branches:
      - main

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: prepare
        uses: ./.github/actions/prepare
        with:
          all-features: true
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        id: toolchain
        with:
          toolchain: nightly
      - run: rustup override set "${TOOLCHAIN}"
        env:
          TOOLCHAIN: ${{steps.toolchain.outputs.name}}

      - name: Build latest rustdocs
        shell: bash
        env:
          ALL_FEATURES: ${{ steps.prepare.outputs.all-features }}
          FEATURES: ${{ steps.prepare.outputs.feature-list }}
          RUSTDOCFLAGS: -Z unstable-options --enable-index-page --cfg docsrs
        run: |
          feature_flags=()
          if [[ "$ALL_FEATURES" == true ]]; then
            feature_flags+=(--all-features)
          elif [[ -n "$FEATURES" ]]; then
            feature_flags+=(--features "$FEATURES")
          fi
          cargo doc --no-deps --workspace "${feature_flags[@]}"

      - name: Move latest rustdocs into book
        run: |
          mkdir -p ./book/book/rustdoc
          mv ./target/doc ./book/book/rustdoc/latest

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./book/book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

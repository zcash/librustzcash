[package]
name = "zcash_client_sqlite"
description = "An SQLite-based Zcash light client"
version = "0.22.0-rc.8"
authors = [
    "Jack Grigg <jack@z.cash>",
    "Kris Nuttycombe <kris@electriccoin.co>"
]
homepage = "https://github.com/zcash/librustzcash"
repository.workspace = true
readme = "README.md"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
# Manually specify features while `orchard` is not in the public API.
#all-features = true
features = [
    "multicore",
    "test-dependencies",
    "transparent-inputs",
    "unstable",
]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
zcash_address.workspace = true
zcash_client_backend = { workspace = true, features = ["unstable-serialization", "unstable-spanning-tree"] }
zcash_encoding.workspace = true
zcash_keys = { workspace = true, features = ["sapling"] }
zcash_pool_migration.workspace = true
zcash_primitives.workspace = true
zcash_protocol.workspace = true
zcash_script.workspace = true
zip32.workspace = true
transparent.workspace = true

# Dependencies exposed in a public API:
# (Breaking upgrades to these require a breaking upgrade to this crate.)
# - Errors
bip32 = { workspace = true, optional = true }
bs58.workspace = true

# - ZeWIF wallet interchange
zewif = { workspace = true, optional = true }
bech32 = { workspace = true, optional = true }
bip0039 = { workspace = true, optional = true, features = ["all-languages"] }

# - Logging and metrics
tracing.workspace = true

# - Serialization
bitflags.workspace = true
byteorder.workspace = true
hex.workspace = true
nonempty.workspace = true
prost.workspace = true
group.workspace = true
jubjub.workspace = true
serde = { workspace = true, optional = true }

# - Secret management
secrecy.workspace = true
subtle.workspace = true

# - Static assertions
static_assertions.workspace = true

# - Shielded protocols
orchard = { workspace = true, optional = true }
sapling.workspace = true

# - Transparent protocol
secp256k1 = { workspace = true, optional = true }

# - Note commitment trees
incrementalmerkletree.workspace = true
shardtree = { workspace = true, features = ["legacy-api"] }

# - SQLite databases
rusqlite = { workspace = true, features = ["time", "array", "uuid", "hooks"] }
schemerz.workspace = true
schemerz-rusqlite.workspace = true
time.workspace = true
uuid = { workspace = true, features = ["v4"] }
regex = { workspace = true }

# Dependencies used internally:
# (Breaking upgrades to these are usually backwards-compatible, but check MSRVs.)
document-features.workspace = true
maybe-rayon.workspace = true
pastey = { workspace = true, optional = true }
pczt.workspace = true
rand_core.workspace = true
rand_distr.workspace = true
rand.workspace = true

ambassador = { workspace = true, optional = true }
rand_chacha = { workspace = true, optional = true }
tempfile = { version = "3.5.0", optional = true }

[dev-dependencies]
ambassador.workspace = true
assert_matches.workspace = true
bls12_381.workspace = true
incrementalmerkletree = { workspace = true, features = ["test-dependencies"] }
incrementalmerkletree-testing.workspace = true
pasta_curves.workspace = true
pczt = { workspace = true, features = ["orchard", "tx-extractor"] }
shardtree = { workspace = true, features = ["legacy-api", "test-dependencies"] }
orchard = { workspace = true, features = ["test-dependencies"] }
proptest.workspace = true
rand_chacha.workspace = true
rand_core.workspace = true
secp256k1 = { workspace = true, features = ["rand"] }
tempfile = "3.5.0"
zcash_keys = { workspace = true, features = ["test-dependencies"] }
zcash_note_encryption.workspace = true
zcash_proofs = { workspace = true, features = ["bundled-prover"] }
zcash_primitives = { workspace = true, features = ["test-dependencies", "non-standard-fees"] }
zcash_protocol = { workspace = true, features = ["local-consensus"] }
zcash_client_backend = { workspace = true, features = ["test-dependencies", "unstable-serialization", "unstable-spanning-tree"] }
zcash_address = { workspace = true, features = ["test-dependencies"] }
# The backend's shared conformance suite and proptest strategies, so the pool-migration store is
# exercised by the ONE per-store framework instead of hand-rolled fixtures. The `WalletMigration`
# adapter that the end-to-end proving simulation drives comes from `wallet`, which the `orchard`
# feature below enables; see the note there for why it may not be enabled from here.
zcash_pool_migration = { workspace = true, features = ["test-dependencies"] }
zip321 = { workspace = true }

[features]
default = ["multicore", "orchard"]
zip-233 = ["zcash_primitives/zip-233", "zcash_client_backend/zip-233"]

## Enables multithreading support for creating proofs and building subtrees.
multicore = ["maybe-rayon/threads", "zcash_primitives/multicore"]

## Enables support for storing data related to the sending and receiving of
## Orchard funds.
##
## This also enables `zcash_pool_migration/wallet`, which supplies the `WalletMigration` adapter
## the end-to-end migration proving simulation drives. That feature forces
## `zcash_client_backend/orchard` on, so it must never be reachable while this crate's `orchard`
## feature is off — including from a dev-dependency, whose features unify into every workspace
## build. This crate's storage-trait impls are gated on this feature while the backend traits grow
## their Orchard and Ironwood methods under theirs, so the two must turn on together or the impls
## stop satisfying the traits.
orchard = [
    "dep:orchard",
    "zcash_client_backend/orchard",
    "zcash_keys/orchard",
    "zcash_pool_migration/wallet",
    # The pool-migration store finalizes a proved migration PCZT into a `Transaction` when it
    # persists it to the wallet's transaction tables (`PoolMigrations::store_proved_transaction`).
    "pczt/orchard",
    "pczt/spend-finalizer",
    "pczt/tx-extractor",
]

## Exposes APIs that are useful for testing, such as `proptest` strategies.
test-dependencies = [
    "dep:ambassador",
    "dep:rand_chacha",
    "dep:tempfile",
    "incrementalmerkletree/test-dependencies",
    "zcash_primitives/test-dependencies",
    "zcash_client_backend/test-dependencies",
]

## Enables receiving transparent funds and sending to transparent recipients
transparent-inputs = [
  "dep:bip32",
  "dep:secp256k1",
  "transparent/transparent-inputs",
  "zcash_keys/transparent-inputs",
  "zcash_client_backend/transparent-inputs"
]

## Emits per-outpoint `TransactionDataRequest::SpendsOfTransparentOutput` requests
## (instead of address-based `TransactionsInvolvingAddress`) for transparent spend
## detection, for wallets whose chain-data source has a spent-outpoint index.
spend-index = [
  "transparent-inputs",
  "zcash_client_backend/spend-index",
]

# Enables operations that permit arbitrary transparent pubkeys to be associated
# with an account in the wallet. Applications that rely on this feature mut
# maintain spending keys corresponding to all imported pubkeys for any account
# from which it permits spending.
transparent-key-import = [
  "transparent-inputs",
  "zcash_client_backend/transparent-key-import"
]

## Enables import from legacy zcashd wallet.dat wallets.
zcashd-compat = [
  "zcash_keys/zcashd-compat",
  "zcash_client_backend/zcashd-compat"
]

## Enables importing wallets from ZeWIF (Zcash Wallet Interchange Format)
## documents. Spending key material carried by a document is diverted to a
## caller-provided `SecretSink` and is never stored in the wallet
## database.
zewif = [
  "dep:zewif",
  "dep:bech32",
  "dep:bip0039",
  "orchard",
  "transparent-inputs",
  "transparent-key-import",
  "zcashd-compat",
  "zcash_keys/unstable",
]

## Enables `serde` derives for certain types.
serde = ["dep:serde", "uuid/serde"]

#! ### Experimental features

## Exposes unstable APIs. Their behaviour may change at any time.
unstable = ["dep:pastey", "zcash_client_backend/unstable"]

## A feature used to isolate tests that are expensive to run. Test-only.
expensive-tests = []

## Marks expensive tests as ignored without removing them from compilation. Test-only.
ignore-expensive-tests = []

## A feature used to enable PCZT-specific tests. Test-only.
##
## This enables this crate's `orchard` and `transparent-inputs` features, because
## `zcash_client_backend/pczt` forces the backend's counterparts on, and the backend's storage
## traits and this crate's impls must grow their pool-specific methods together or the impls stop
## satisfying the traits.
pczt-tests = [
    "serde",
    "orchard",
    "transparent-inputs",
    "zcash_client_backend/pczt",
]

[lib]
bench = false

[lints]
workspace = true

[package]
name = "zcash_transparent"
description = "Rust implementations of the Zcash transparent protocol"
version = "0.12.0"
authors = [
    "Jack Grigg <jack@electriccoin.co>",
    "Kris Nuttycombe <kris@electriccoin.co>",
    "Daira-Emma Hopwood <daira@electriccoin.co>",
]
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Dependencies exposed in a public API:
# (Breaking upgrades to these require a breaking upgrade to this crate.)
# - Encodings
corez.workspace = true

# - Test dependencies
proptest = { workspace = true, optional = true }

# - PCZT
#   - `ChildNumber` type exposed
bip32.workspace = true

# - Transparent protocol
#   - Script types exposed
zcash_script.workspace = true

# - Transparent inputs
#   - `SecretKey` and `PublicKey` types exposed
secp256k1 = { workspace = true, optional = true }

# Dependencies used internally:
# (Breaking upgrades to these are usually backwards-compatible, but check MSRVs.)
# - Boilerplate
getset.workspace = true

# - Digests
sha2.workspace = true

# - Documentation
document-features = { workspace = true, optional = true }

# - Encodings
hex.workspace = true

# - Transparent protocol
ripemd.workspace = true

[dev-dependencies]
proptest.workspace = true

[features]
default = ["std"]
std = [
    "dep:document-features",
    "secp256k1?/std",
    "zcash_script/std",
]

## Enables spending transparent notes with the transaction builder.
transparent-inputs = ["dep:secp256k1"]

## Exposes APIs that are useful for testing, such as `proptest` strategies.
test-dependencies = ["dep:proptest"]

[lints]
workspace = true
